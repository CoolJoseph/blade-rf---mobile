name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Unpack native sources
        run: |
          if [ ! -d native ] && [ -f native.tar.gz ]; then tar xzf native.tar.gz; fi
          test -f native/CMakeLists.txt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        id: py
        with:
          python-version: "3.11"

      - name: Engine self-test (simulator)
        run: |
          python -m pip install --quiet "numpy<2"
          python tests/test_backend.py

      - name: Build debug APK
        working-directory: android
        env:
          CHAQUOPY_PYTHON: ${{ steps.py.outputs.python-path }}
        run: |
          chmod +x gradlew
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: bladeRF-Mobile-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
