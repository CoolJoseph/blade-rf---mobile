# Builds the APK in GitHub's cloud -- no Android Studio and no access to
# Maven Central needed on your own network. Runs on every push and from the
# Actions tab ("Run workflow"). The APK appears under the run's Artifacts.
name: Build APK + Desktop

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      # The libbladeRF + libusb sources travel as one archive, so the whole
      # project fits in a single drag-and-drop upload on github.com.
      - name: Unpack native sources
        run: |
          if [ ! -d native ] && [ -f native.tar.gz ]; then tar xzf native.tar.gz; fi
          test -f native/CMakeLists.txt
          echo "---- files in the repository ----"
          find . -maxdepth 3 -not -path "./.git*" -not -path "./native/*" | sort
          if [ ! -f android/gradlew ]; then
            echo "::error::The android folder is missing from the repository - upload it (see the list above)."
            exit 1
          fi

      # bionic (Android's C library) has no pthread_cancel; harmless if the
      # archive already carries this fix
      - name: Android fix for libbladeRF
        run: |
          sed -i 's|define THREAD_CANCEL(m) pthread_cancel(m)|define THREAD_CANCEL(m) ((void)(m))|' native/bladeRF/host/common/include/thread.h
          grep -n "THREAD_CANCEL" native/bladeRF/host/common/include/thread.h

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Chaquopy runs pip with the same Python version the app embeds
      - uses: actions/setup-python@v6
        id: py
        with:
          python-version: "3.11"

      - name: Engine self-test (simulator)
        run: |
          if [ ! -f tests/test_backend.py ]; then echo "tests folder not uploaded - skipping the self-test"; exit 0; fi
          python -m pip install --quiet "numpy<2"
          python tests/test_backend.py

      # The FPGA image goes inside the APK, so a board that does not load its
      # FPGA from flash still starts on the phone. Nuand publishes it.
      - name: Bundle the bladeRF FPGA image (hostedxA4.rbf)
        continue-on-error: true
        run: |
          mkdir -p android/app/src/main/assets/fpga
          for u in https://www.nuand.com/fpga/hostedxA4-latest.rbf \
                   https://www.nuand.com/fpga/v0.16.0/hostedxA4.rbf \
                   https://www.nuand.com/fpga/v0.15.3/hostedxA4.rbf \
                   https://nuand.com/fpga/hostedxA4-latest.rbf; do
            if curl -fsSL --retry 2 -o /tmp/fpga.rbf "$u" && [ "$(stat -c%s /tmp/fpga.rbf)" -gt 1000000 ]; then
              mv /tmp/fpga.rbf android/app/src/main/assets/fpga/hostedxA4.rbf
              echo "FPGA image from $u: $(stat -c%s android/app/src/main/assets/fpga/hostedxA4.rbf) bytes"
              break
            fi
          done
          ls -la android/app/src/main/assets/fpga

      - name: Build debug APK
        working-directory: android
        env:
          CHAQUOPY_PYTHON: ${{ steps.py.outputs.python-path }}
        run: |
          chmod +x gradlew
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          ./gradlew --no-daemon assembleDebug

      - name: Fetch the bladeRF FX3 firmware (for flashing from a PC)
        continue-on-error: true
        run: |
          mkdir -p fx3
          for u in https://www.nuand.com/fx3/bladeRF_fw_latest.img \
                   https://nuand.com/fx3/bladeRF_fw_latest.img \
                   https://www.nuand.com/fx3/bladeRF_fw_v2.6.0.img; do
            if curl -fsSL --retry 2 -o fx3/bladeRF_fw_latest.img "$u" && [ "$(stat -c%s fx3/bladeRF_fw_latest.img)" -gt 100000 ]; then
              echo "FX3 firmware from $u: $(stat -c%s fx3/bladeRF_fw_latest.img) bytes"; break
            fi
            rm -f fx3/bladeRF_fw_latest.img
          done

      - uses: actions/upload-artifact@v6
        continue-on-error: true
        with:
          name: bladeRF-FX3-firmware
          path: fx3/*.img
          if-no-files-found: warn

      # File names carry the software name, the platform and the version:
      # NPBRF ANDR1.3.apk -- the version is read from mobile_app.py.
      - name: Name the APK
        run: |
          VER=$(sed -n 's/^APP_VERSION = "\(.*\)"/\1/p' android/app/src/main/python/mobile_app.py)
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/NPBRF ANDR${VER}.apk"
          echo "APK_NAME=NPBRF ANDR${VER}" >> "$GITHUB_ENV"
          ls -la out

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ env.APK_NAME }}
          path: out/*.apk
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # Desktop edition: one Windows .exe, no Python needed on the PC.
  # --------------------------------------------------------------------------
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          architecture: x64

      - name: Build NPBRF WIN<version>.exe
        shell: pwsh
        run: |
          $ver = (Select-String -Path android/app/src/main/python/mobile_app.py -Pattern '^APP_VERSION = "(.*)"').Matches[0].Groups[1].Value
          $name = "NPBRF WIN$ver"
          "EXE_NAME=$name" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          python -m pip install --quiet "numpy<2" pyinstaller
          python -m PyInstaller --noconfirm --onefile --windowed --name "$name" --icon desktop/netline.ico `
            --add-data "android/app/src/main/python;engine" `
            --add-data "android/app/src/main/assets/webui;webui" `
            --exclude-module PyQt5 --exclude-module pyqtgraph `
            desktop/bladeRF_Workbench_Desktop.py

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ env.EXE_NAME }}
          path: dist/${{ env.EXE_NAME }}.exe
          if-no-files-found: error

      - name: Smoke test (simulator, no window) - diagnostic only
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $p = Start-Process -FilePath "dist/$env:EXE_NAME.exe" -ArgumentList "--sim","--no-window" -PassThru
          $ok = $false; $err = ""
          for ($i = 0; $i -lt 30 -and -not $ok; $i++) {
            Start-Sleep -Seconds 2
            try { $r = Invoke-WebRequest -UseBasicParsing -TimeoutSec 10 http://127.0.0.1:18765/api/state; $ok = $r.StatusCode -eq 200 }
            catch { $err = $_.Exception.Message }
          }
          "state ok: $ok  last error: $err"
          try { $f = Invoke-WebRequest -UseBasicParsing -TimeoutSec 10 "http://127.0.0.1:18765/api/frame?since=-1"; "frame: $($f.StatusCode) $($f.RawContentLength) bytes" } catch { "frame error: $($_.Exception.Message)" }
          curl.exe -s -S -m 10 http://127.0.0.1:18765/api/state | Select-Object -First 1 | ForEach-Object { $_.Substring(0, [Math]::Min(400, $_.Length)) }
          "--- process alive: $(-not $p.HasExited)"
          "--- log.txt:"
          Get-Content "$env:USERPROFILE\Documents\NETLINE Spectrum Analyzer\log.txt" -ErrorAction SilentlyContinue | Select-Object -Last 60
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          # diagnostic only: never fails the run; the .exe is already uploaded
          if (-not $ok) { Write-Output "::warning::Smoke test: the desktop app did not answer on the build server (the .exe was still built and uploaded)" }
          exit 0
